[package]
name = "marmot"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "marmot"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.22"

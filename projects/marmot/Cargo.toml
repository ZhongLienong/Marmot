[package]
name = "marmot"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "marmot"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
flate2 = "1"
lsp-server = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml_edit = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
